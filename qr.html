<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan to open GigWork Tracker</title>
<meta name="theme-color" content="#12151a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151a;
    --surface:#1b2028;
    --border:#2c3542;
    --text:#eceef1;
    --text-dim:#aeb4bf;
    --amber:#f4b740;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 700px 380px at 50% -10%, rgba(244,183,64,0.10), transparent),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:40px 36px;
    text-align:center;
    max-width:340px;
    width:100%;
  }
  .brand{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-bottom:22px;
  }
  .brand span{color:var(--amber);}
  .qr-frame{
    background:#fff;
    border-radius:14px;
    padding:16px;
    display:inline-block;
    margin-bottom:22px;
  }
  .qr-frame img{
    display:block;
    width:220px;
    height:220px;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-size:19px;
    font-weight:600;
    margin:0 0 8px;
  }
  p{
    font-size:13.5px;
    color:var(--text-dim);
    margin:0 0 22px;
    line-height:1.5;
  }
  a.link{
    display:inline-block;
    background:var(--amber);
    color:#1a1305;
    font-weight:700;
    font-size:14px;
    text-decoration:none;
    padding:12px 26px;
    border-radius:10px;
  }
  .url{
    margin-top:16px;
    font-size:12px;
    color:var(--text-dim);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">GIG<span>WORK</span></div>
    <div class="qr-frame">
      <img src="qr.png" alt="QR code linking to gigworktracker.com">
    </div>
    <h1>Scan to open GigWork Tracker</h1>
    <p>Point your phone's camera at the code, or tap the link below.</p>
    <a class="link" href="index.html#install">Open GigWork Tracker →</a>
    <div class="url">gigworktracker.com</div>
  </div>
</body>
</html>
