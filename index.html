    --green-dim:#265d3f;
    --rose:#fb7185;
    --rose-dim:#6b2f38;
    --blue:#60a5fa;

  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);

    font-family:'Inter',sans-serif;

  }

  .disp{font-family:'Oswald',sans-serif;}

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse 600px 300px at 50% -10%, rgba(244,183,64,0.08), transparent),

  .header{

  #view-container{

  /* ---- cards ---- */
  .card{

<body>

<div id="app">
  <div class="header">
    <div class="brand">GIG WORK <span>TRACKER</span></div>
    <div class="date-chip" id="header-date"></div>
  </div>
  <div id="view-container"></div>
  <nav class="tabbar" id="tabbar">
    <button data-view="home" class="active">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Home
    </button>
    <button data-view="log">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Log
    </button>
    <button data-view="history">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l4 2"/></svg>
      History
    </button>
    <button data-view="reports">
      <svg viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="8"/><rect x="10" y="7" width="4" height="13"/><rect x="17" y="3" width="4" height="17"/></svg>
      Reports
    </button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* ======================= STATE ======================= */
let shifts = [];   // {id,date,startTime,endTime,startOdo,endOdo,expenses, [platformKey]: amount...}
let fillups = [];  // {id,date,odometer,gallons,pricePerGallon}
let customPlatforms = []; // {key, label}
let currentView = 'home';
let logMode = 'shift'; // 'shift' | 'gas'
let reportsRange = 'week'; // day|week|month|year
let editingShiftId = null;
let editingFillupId = null;
let addingPlatform = false;
let formDraft = null; // holds in-progress shift-form field values across re-renders (e.g. when adding/renaming a platform)

// Base platforms. Keys are permanent (used as storage field names) — do not rename existing keys.
const BASE_PLATFORMS = [
  {key:'uber', label:'Uber/Uber Eats', color:'#1fb6ff'},
  {key:'lyft', label:'Lyft', color:'#fb50a8'},
  {key:'doordash', label:'DoorDash', color:'#ff3d3d'},
  {key:'grubhub', label:'Cash Tips', color:'#7ac142'}
];
// Legacy keys from earlier versions of the app, kept only so old test data still totals correctly.
const LEGACY_PLATFORM_KEYS = ['instacart','other'];

function allPlatforms(){ return [...BASE_PLATFORMS, ...customPlatforms]; }
function isCustomPlatform(key){ return customPlatforms.some(p=>p.key===key); }
function platformHasAnyData(key){ return shifts.some(s => (Number(s[key])||0) !== 0); }

/* ======================= STORAGE =======================
   Uses the browser's own localStorage, so data lives on THIS device only,
   works fully offline, and survives being added to the Home Screen.
   Key names are permanent — never rename these, or existing data will
   appear to "disappear" (it'll still be in localStorage, just orphaned). */
const LS_SHIFTS = 'giggauge_shifts';
const LS_FILLUPS = 'giggauge_fillups';
const LS_CUSTOM_PLATFORMS = 'giggauge_customplatforms';

async function loadData(){
  try{
    const raw = localStorage.getItem(LS_SHIFTS);
    shifts = raw ? JSON.parse(raw) : [];
  }catch(e){ shifts = []; }
  try{
    const raw = localStorage.getItem(LS_FILLUPS);
    fillups = raw ? JSON.parse(raw) : [];
  }catch(e){ fillups = []; }
  try{
    const raw = localStorage.getItem(LS_CUSTOM_PLATFORMS);
    customPlatforms = raw ? JSON.parse(raw) : [];
  }catch(e){ customPlatforms = []; }
}
async function saveShifts(){
  try{ localStorage.setItem(LS_SHIFTS, JSON.stringify(shifts)); }
  catch(e){ showToast('Save failed — storage may be full'); }
}
async function saveFillups(){
  try{ localStorage.setItem(LS_FILLUPS, JSON.stringify(fillups)); }
  catch(e){ showToast('Save failed — storage may be full'); }
}
async function saveCustomPlatforms(){
  try{ localStorage.setItem(LS_CUSTOM_PLATFORMS, JSON.stringify(customPlatforms)); }
  catch(e){ showToast('Save failed — storage may be full'); }
}

function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function csvEscape(v){
  const s = String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ======================= HELPERS ======================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function todayISO(){
  // Use LOCAL date parts, not toISOString() (which is UTC and would roll
  // "today" over 7-8 hours early for US time zones).
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function fmtMoney(n){
  if(n===null||n===undefined||isNaN(n)) return '$0.00';
  const neg = n<0;
  const v = Math.abs(n).toFixed(2);
  return (neg?'-$':'$')+v;
}
function fmtNum(n, d=1){
  if(n===null||n===undefined||isNaN(n)) return '0';
  return Number(n).toFixed(d);
}
function fmtDateShort(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function fmtDateFull(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric', year:'numeric'});
}
function timeToMinutes(t){
  if(!t) return null;
  const [h,m] = t.split(':').map(Number);
  return h*60+m;
}
function computeHours(startTime, endTime){
  let s = timeToMinutes(startTime), e = timeToMinutes(endTime);
  if(s===null||e===null) return 0;
  let diff = e - s;
  if(diff < 0) diff += 24*60; // overnight shift
  return diff/60;
}
function isOpenShift(shift){
  return !shift.endTime || shift.endOdo===''||shift.endOdo===null||shift.endOdo===undefined;
}

/* --- gas periods derived from fillups, sorted by odometer --- */
function getPeriods(){
  const sorted = [...fillups].sort((a,b)=> a.odometer - b.odometer);
  const periods = [];
  for(let i=1;i<sorted.length;i++){
    const prev = sorted[i-1], cur = sorted[i];
    const milesBetween = cur.odometer - prev.odometer;
    const mpg = cur.gallons>0 ? milesBetween/cur.gallons : null;
    periods.push({
      startOdo: prev.odometer,
      endOdo: cur.odometer,
      startDate: prev.date,
      endDate: cur.date,
      mpg: mpg,
      pricePerGallon: cur.pricePerGallon
    });
  }
  return periods; // chronological by odometer
}

// Finds the MPG/price to apply to a shift: the fill-up period it falls inside;
// otherwise the nearest period before it; otherwise (shift predates all fill-up
// data) the EARLIEST period available — this is what lets a later fill-up
// retroactively price gas for earlier un-priced shifts, and lets the most
// recent known MPG keep pricing shifts going forward until a new fill-up is logged.
function effectiveMpgForShift(shift, periods){
  if(periods.length===0) return null;
  let match = periods.find(p => shift.date >= p.startDate && shift.date <= p.endDate);
  if(!match){
    const before = periods.filter(p=>p.endDate <= shift.date).sort((a,b)=> b.endDate.localeCompare(a.endDate));
    if(before.length) match = before[0];
  }
  if(!match){
    match = periods[0];
  }
  return match && match.mpg ? {mpg:match.mpg, price:match.pricePerGallon} : null;
}

function deriveShift(shift, periods){
  const open = isOpenShift(shift);
  const hours = open ? 0 : computeHours(shift.startTime, shift.endTime);
  const miles = open ? 0 : Math.max(0, (Number(shift.endOdo)||0) - (Number(shift.startOdo)||0));
  const earningsByPlatform = {};
  let totalEarnings = 0;
  allPlatforms().forEach(p=>{
    const v = Number(shift[p.key])||0;
    earningsByPlatform[p.key] = v;
    totalEarnings += v;
  });
  LEGACY_PLATFORM_KEYS.forEach(k=>{
    totalEarnings += Number(shift[k])||0;
  });
  const expenses = Number(shift.expenses)||0;
  const mpgInfo = open ? null : effectiveMpgForShift(shift, periods);
  let gasCost = 0, hasGasData = false;
  if(mpgInfo && mpgInfo.mpg > 0){
    hasGasData = true;
    gasCost = (miles / mpgInfo.mpg) * mpgInfo.price;
  }
  const net = totalEarnings - gasCost - expenses;
  const perHourGross = hours>0 ? totalEarnings/hours : 0;
  const perHourNet = hours>0 ? net/hours : 0;
  return {open, hours, miles, totalEarnings, gasCost, expenses, hasGasData, net, perHourGross, perHourNet, earningsByPlatform, mpg: mpgInfo?mpgInfo.mpg:null};
}

function allDerivedShifts(){
  const periods = getPeriods();
  return shifts.map(s => ({...s, d: deriveShift(s, periods)}));
}

function sumAgg(list){
  const agg = {hours:0, miles:0, totalEarnings:0, gasCost:0, expenses:0, net:0, anyGasData:false};
  list.forEach(s=>{
    agg.hours += s.d.hours;
    agg.miles += s.d.miles;
    agg.totalEarnings += s.d.totalEarnings;
    agg.gasCost += s.d.gasCost;
    agg.expenses += s.d.expenses;
    agg.net += s.d.net;
    if(s.d.hasGasData) agg.anyGasData = true;
  });
  agg.perHourGross = agg.hours>0 ? agg.totalEarnings/agg.hours : 0;
  agg.perHourNet = agg.hours>0 ? agg.net/agg.hours : 0;
  return agg;
}

function isSameDay(iso, ref){ return iso === ref; }
function isSameWeek(iso, ref){
  const d = new Date(iso+'T00:00:00'), r = new Date(ref+'T00:00:00');
  const startOfWeek = (dt)=>{ const x=new Date(dt); const day=x.getDay(); x.setDate(x.getDate()-day); return x; };
  return startOfWeek(d).getTime() === startOfWeek(r).getTime();
}
function isSameMonth(iso, ref){
  return iso.slice(0,7) === ref.slice(0,7);
}
function isSameYear(iso, ref){
  return iso.slice(0,4) === ref.slice(0,4);
}

function weekOfMonth(iso){
  const d = new Date(iso+'T00:00:00');
  return Math.ceil((d.getDate())/7);
}

function hourLabel(h){
  if(h===null||h===undefined) return '—';
  const ampm = h<12?'AM':'PM';
  let hh = h%12; if(hh===0) hh=12;
  return `${hh}:00 ${ampm}`;
}

function platformLabel(key){
  const p = allPlatforms().find(p=>p.key===key);
  return p ? p.label : key;
}

/* Best N-hour block to start, based on full shift history (completed shifts only) */
function computeBestBlock(derivedCompleted, blockLen){
  const buckets = {};
  for(let h=0;h<24;h++) buckets[h] = {hours:0, earnings:0, platformEarnings:{}};
  derivedCompleted.forEach(s=>{
    const sm = timeToMinutes(s.startTime);
    if(sm===null || s.d.hours<=0) return;
    const h = Math.floor(sm/60);
    buckets[h].hours += s.d.hours;
    buckets[h].earnings += s.d.totalEarnings;
    Object.keys(s.d.earningsByPlatform).forEach(k=>{
      buckets[h].platformEarnings[k] = (buckets[h].platformEarnings[k]||0) + s.d.earningsByPlatform[k];
    });
  });

  let best = null;
  for(let start=0; start<24; start++){
    let hours=0, earnings=0; const platformEarnings={};
    for(let i=0;i<blockLen;i++){
      const h = (start+i)%24;
      hours += buckets[h].hours;
      earnings += buckets[h].earnings;
      Object.keys(buckets[h].platformEarnings).forEach(k=>{
        platformEarnings[k] = (platformEarnings[k]||0) + buckets[h].platformEarnings[k];
      });
    }
    if(hours < 0.5) continue; // not enough data in this window
    const rate = earnings/hours;
    if(!best || rate > best.rate){
      const platformsUsed = Object.keys(platformEarnings)
        .filter(k=>platformEarnings[k]>0)
        .sort((a,b)=>platformEarnings[b]-platformEarnings[a])
        .map(k=>platformLabel(k));
      best = {start, rate, platformsUsed};
    }
  }
  return best;
}

function joinPlatformList(list){
  if(!list || list.length===0) return null;
  if(list.length===1) return list[0];
  if(list.length===2) return list[0]+' and '+list[1];
  return list.slice(0,-1).join(', ')+', and '+list[list.length-1];
}

}

/* ======================= REPORTS ======================= */
function renderReports(){
  const today = todayISO();
  const derived = allDerivedShifts();
  const completed = derived.filter(s=>!s.d.open);

  let filtered;
  if(reportsRange==='day') filtered = derived.filter(s=>isSameDay(s.date,today));
  else if(reportsRange==='week') filtered = derived.filter(s=>isSameWeek(s.date,today));
  else if(reportsRange==='month') filtered = derived.filter(s=>isSameMonth(s.date,today));
  else filtered = derived.filter(s=>isSameYear(s.date,today));

  const agg = sumAgg(filtered);

  // Best hour of day (single-hour view, kept for the month/year insight cards below)
  // Best week of this month
  const monthShifts = completed.filter(s=>isSameMonth(s.date, today));
  const weekBuckets = {};
  monthShifts.forEach(s=>{
    const w = weekOfMonth(s.date);
    weekBuckets[w] = (weekBuckets[w]||0) + s.d.net;
  });
  let bestWeek = null, bestWeekVal = -Infinity;
  Object.keys(weekBuckets).forEach(w=>{
    if(weekBuckets[w]>bestWeekVal){ bestWeekVal = weekBuckets[w]; bestWeek = Number(w); }
  });

  // Best month of this year
  const yearShifts = completed.filter(s=>isSameYear(s.date, today));
  const monthBuckets = {};
  yearShifts.forEach(s=>{
    const m = s.date.slice(0,7);
    monthBuckets[m] = (monthBuckets[m]||0) + s.d.net;
  });
  let bestMonth = null, bestMonthVal = -Infinity;
  Object.keys(monthBuckets).forEach(m=>{
    if(monthBuckets[m]>bestMonthVal){ bestMonthVal = monthBuckets[m]; bestMonth = m; }
  });

  function monthLabel(m){
    if(!m) return '—';
    const d = new Date(m+'-01T00:00:00');
    return d.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  }

  const block2 = computeBestBlock(completed, 2);
  const block4 = computeBestBlock(completed, 4);

  return `
    <div class="segmented">
      <button data-range="day" class="${reportsRange==='day'?'active':''}">Day</button>
      <button data-range="week" class="${reportsRange==='week'?'active':''}">Week</button>
      <button data-range="month" class="${reportsRange==='month'?'active':''}">Month</button>
      <button data-range="year" class="${reportsRange==='year'?'active':''}">Year</button>
    </div>

    <div class="card">
      <div class="card-title">Summary — ${reportsRange==='day'?'Today':reportsRange==='week'?'This Week':reportsRange==='month'?'This Month':'This Year'}</div>
      <div class="stat-grid">
        <div class="stat-box"><div class="label">Hours</div><div class="value blue num">${fmtNum(agg.hours)}</div></div>
        <div class="stat-box"><div class="label">Miles</div><div class="value blue num">${fmtNum(agg.miles,0)}</div></div>
        <div class="stat-box"><div class="label">Earnings</div><div class="value num">${fmtMoney(agg.totalEarnings)}</div></div>
        <div class="stat-box"><div class="label">Gas Cost</div><div class="value rose num">${fmtMoney(agg.gasCost)}</div></div>
        <div class="stat-box"><div class="label">Expenses</div><div class="value rose num">${fmtMoney(agg.expenses)}</div></div>
        <div class="stat-box"><div class="label">Net Pay</div><div class="value green num">${fmtMoney(agg.net)}</div></div>
      </div>
    </div>

    <div class="section-label">Today's Best Blocks</div>
    <div class="insight-card">
      <div class="itxt">Best 2-hour block to start today: <b>${block2 ? hourLabel(block2.start) : '—'}</b>${block2?` — avg ${fmtMoney(block2.rate)}/hr | ${joinPlatformList(block2.platformsUsed)||'—'}`:' (not enough history yet)'}.</div>
    </div>
    <div class="insight-card">
      <div class="itxt">Best 4-hour block to start today: <b>${block4 ? hourLabel(block4.start) : '—'}</b>${block4?` — avg ${fmtMoney(block4.rate)}/hr | ${joinPlatformList(block4.platformsUsed)||'—'}`:' (not enough history yet)'}.</div>
    </div>
    <div style="font-size:11px;color:var(--text-faint);margin:-4px 0 16px;">Based on your full shift history by start time, not just today's entries.</div>

    <div class="section-label">More Insights</div>
    <div class="insight-card">
      <div class="itxt">This month, <b>Week ${bestWeek||'—'}</b> was your best week${bestWeek?` (net ${fmtMoney(bestWeekVal)})`:''}.</div>
    </div>
    <div class="insight-card">
      <div class="itxt">This year, <b>${monthLabel(bestMonth)}</b> was your best month${bestMonth?` (net ${fmtMoney(bestMonthVal)})`:''}.</div>
    </div>
    ${completed.length===0?'<div class="empty">Log a few completed shifts to unlock insights.</div>':''}

    ${renderQuarterlyTaxCard(completed, today)}

    <div class="section-label">Backup &amp; Export</div>
    <div class="card">
      <div class="card-title">Keep Your Own Copy</div>
      <div style="font-size:12.5px;color:var(--text-dim);line-height:1.5;margin-bottom:12px;">
        Your data lives only in this browser on this device. Export a backup now and then — save it to Files, email it to yourself, or use the CSV for taxes.
      </div>
      <button class="btn btn-primary" id="export-json" style="margin-bottom:8px;">Export Full Backup (JSON)</button>
      <button class="btn btn-ghost" id="export-csv">Export Shifts as CSV</button>
    </div>
  `;
}

/* ======================= QUARTERLY ESTIMATED TAX ======================= */
function getQuarterPeriods(year){
  return [
    {label:'Q1', start:`${year}-01-01`, end:`${year}-03-31`, due:`Apr 15, ${year}`},
    {label:'Q2', start:`${year}-04-01`, end:`${year}-05-31`, due:`Jun 15, ${year}`},
    {label:'Q3', start:`${year}-06-01`, end:`${year}-08-31`, due:`Sep 15, ${year}`},
    {label:'Q4', start:`${year}-09-01`, end:`${year}-12-31`, due:`Jan 15, ${year+1}`}
  ];
}

function renderQuarterlyTaxCard(completed, today){
  const year = Number(today.slice(0,4));
  const periods = getQuarterPeriods(year);
  const rows = periods.map(p=>{
    const inRange = completed.filter(s=> s.date>=p.start && s.date<=p.end);
    const net = sumAgg(inRange).net;
    const tax = Math.max(0, net) * 0.153;
    const current = today>=p.start && today<=p.end;
    return `
      <div class="stat-box" style="${current?'border:1px solid var(--amber-dim);':''}">
        <div class="label">${p.label} ${current?'· current':''}</div>
        <div class="value num" style="font-size:19px;">${fmtMoney(net)} net</div>
        <div style="font-size:12px;color:var(--amber);margin-top:2px;font-family:'JetBrains Mono',monospace;">${fmtMoney(tax)} est. tax</div>
        <div style="font-size:10.5px;color:var(--text-faint);margin-top:4px;">Due ${p.due}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="section-label">Estimated Quarterly Taxes (${year})</div>
    <div class="card">
      <div class="card-title">Self-Employment Tax, 15.3% of Net Income</div>
      <div class="stat-grid">${rows}</div>
      <div style="font-size:11px;color:var(--text-faint);margin-top:12px;line-height:1.5;">
        Rough estimate only: net income (earnings minus gas and expenses) × 15.3%. The real IRS calculation applies that rate to 92.35% of net earnings and may involve other deductions or credits. This isn't tax advice — check with a tax professional before you file or pay.
      </div>
    </div>
  `;
}

/* ======================= EVENT HANDLERS ======================= */
function attachViewHandlers(){
  // tab nav
  document.querySelectorAll('.tabbar button').forEach(b=>{
    b.onclick = ()=>{ currentView = b.dataset.view; editingShiftId=null; editingFillupId=null; addingPlatform=false; formDraft=null; render(); };
  });

  if(currentView==='home'){
    const qb = document.getElementById('home-quicklog');
    if(qb) qb.onclick = ()=>{ currentView='log'; logMode='shift'; render(); };
  }

  if(currentView==='log'){
    document.querySelectorAll('.toggle-row button').forEach(b=>{
      b.onclick = ()=>{ logMode=b.dataset.mode; editingShiftId=null; editingFillupId=null; addingPlatform=false; formDraft=null; render(); };
    });

    if(logMode==='shift'){
      const captureFormDraft = ()=>{
        formDraft = formDraft || {};
        document.querySelectorAll('#view-container input[id^="f-"]').forEach(el=>{
          formDraft[el.id] = el.value;
        });
      };
      const upd = ()=>{
        captureFormDraft();
        const start = document.getElementById('f-start').value;
        const end = document.getElementById('f-end').value;
        const so = Number(document.getElementById('f-startodo').value)||0;
        const eo = Number(document.getElementById('f-endodo').value)||0;
        document.getElementById('prev-hours').textContent = end ? fmtNum(computeHours(start,end)) : '—';
        document.getElementById('prev-miles').textContent = eo ? fmtNum(Math.max(0,eo-so),0) : '—';
        let total = 0;
        allPlatforms().forEach(p=>{ const el=document.getElementById('f-'+p.key); if(el) total += Number(el.value)||0; });
        document.getElementById('prev-total').textContent = fmtMoney(total);
      };
      ['f-date','f-start','f-end','f-startodo','f-endodo','f-expenses', ...allPlatforms().map(p=>'f-'+p.key)].forEach(id=>{
        const el = document.getElementById(id);
        if(el) el.oninput = upd;
      });
      upd();

      const showAddBtn = document.getElementById('show-add-platform');
      if(showAddBtn) showAddBtn.onclick = ()=>{ captureFormDraft(); addingPlatform=true; render(); };
      const confirmAddBtn = document.getElementById('confirm-add-platform');
      if(confirmAddBtn) confirmAddBtn.onclick = async ()=>{
        captureFormDraft();
        const nameInput = document.getElementById('new-platform-name');
        const name = nameInput.value.trim();
        if(!name){ showToast('Enter a platform name'); return; }
        const key = 'custom_' + name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') + '_' + uid();
        const colors = ['#60a5fa','#f4b740','#4ade80','#fb7185','#a78bfa','#fb923c'];
        const color = colors[customPlatforms.length % colors.length];
        customPlatforms.push({key, label:name, color});
        await saveCustomPlatforms();
        addingPlatform = false;
        showToast(name+' added');
        render();
      };

      document.querySelectorAll('[data-edit-plat]').forEach(b=>{
        b.onclick = async ()=>{
          captureFormDraft();
          const key = b.dataset.editPlat;
          const cp = customPlatforms.find(p=>p.key===key);
          if(!cp) return;
          const newName = prompt('Rename platform:', cp.label);
          if(newName===null) return;
          const trimmed = newName.trim();
          if(!trimmed){ showToast('Name cannot be empty'); return; }
          cp.label = trimmed;
          await saveCustomPlatforms();
          showToast('Platform renamed');
          render();
        };
      });
      document.querySelectorAll('[data-del-plat]').forEach(b=>{
        b.onclick = async ()=>{
          const key = b.dataset.delPlat;
          if(platformHasAnyData(key)){ showToast("Can't delete — this platform already has earnings recorded"); return; }
          if(!confirm('Delete this platform?')) return;
          captureFormDraft();
          customPlatforms = customPlatforms.filter(p=>p.key!==key);
          await saveCustomPlatforms();
          if(formDraft) delete formDraft['f-'+key];
          showToast('Platform deleted');
          render();
        };
      });

      document.getElementById('save-shift').onclick = async ()=>{
        const date = document.getElementById('f-date').value;
        const startTime = document.getElementById('f-start').value;
        const endTime = document.getElementById('f-end').value;
        const startOdo = document.getElementById('f-startodo').value;
        const endOdo = document.getElementById('f-endodo').value;
        if(!date || !startTime || startOdo===''){ showToast('Date, start time, and start odometer are required'); return; }
        if(endOdo!=='' && Number(endOdo) < Number(startOdo)){ showToast('End odometer must be ≥ start odometer'); return; }
        const record = {
          id: editingShiftId || uid(),
          date, startTime,
          endTime: endTime || null,
          startOdo,
          endOdo: endOdo!=='' ? endOdo : null,
          expenses: document.getElementById('f-expenses').value || 0
        };
        allPlatforms().forEach(p=>{ const el=document.getElementById('f-'+p.key); record[p.key] = el ? (el.value||0) : 0; });

        if(editingShiftId){
          const idx = shifts.findIndex(s=>s.id===editingShiftId);
          shifts[idx] = record;
          editingShiftId = null;
        } else {
          shifts.push(record);
        }
        await saveShifts();
        formDraft = null;
        showToast(record.endTime && record.endOdo ? 'Shift saved' : 'Shift started — finish it later from History');
        currentView='history';
        render();
      };

      const cancelBtn = document.getElementById('cancel-edit-shift');
      if(cancelBtn) cancelBtn.onclick = ()=>{ editingShiftId=null; addingPlatform=false; formDraft=null; currentView='home'; render(); };
    }

    if(logMode==='gas'){
      const upd = ()=>{
        const gallons = Number(document.getElementById('g-gallons').value)||0;
        const price = Number(document.getElementById('g-price').value)||0;
        document.getElementById('prev-gastotal').textContent = fmtMoney(gallons*price);
        const odo = Number(document.getElementById('g-odo').value)||0;
        const sorted = [...fillups].filter(f=>f.id!==editingFillupId).sort((a,b)=>a.odometer-b.odometer);
        const prev = [...sorted].reverse().find(f=>f.odometer < odo);
        const mpgEl = document.getElementById('prev-mpg');
        if(prev && gallons>0){
          mpgEl.textContent = fmtNum((odo-prev.odometer)/gallons,1);
        } else {
          mpgEl.textContent = '—';
        }
      };
      ['g-odo','g-gallons','g-price'].forEach(id=>{
        const el = document.getElementById(id);
        if(el) el.oninput = upd;
      });
      upd();

      document.getElementById('save-fillup').onclick = async ()=>{
        const date = document.getElementById('g-date').value;
        const odometer = Number(document.getElementById('g-odo').value);
        const gallons = Number(document.getElementById('g-gallons').value);
        const pricePerGallon = Number(document.getElementById('g-price').value);
        if(!date || !odometer || !gallons || !pricePerGallon){ showToast('All fields are required'); return; }
        const record = { id: editingFillupId || uid(), date, odometer, gallons, pricePerGallon };
        if(editingFillupId){
          const idx = fillups.findIndex(f=>f.id===editingFillupId);
          fillups[idx] = record;
          editingFillupId = null;
        } else {
          fillups.push(record);
        }
        await saveFillups();
        showToast('Fill-up saved');
        currentView='history';
        render();
      };

      const cancelBtn = document.getElementById('cancel-edit-fillup');
      if(cancelBtn) cancelBtn.onclick = ()=>{ editingFillupId=null; currentView='home'; render(); };
    }
  }

  if(currentView==='history'){
    document.querySelectorAll('[data-edit-shift]').forEach(b=>{
      b.onclick = ()=>{ editingShiftId=b.dataset.editShift; logMode='shift'; addingPlatform=false; formDraft=null; currentView='log'; render(); };
    });
    document.querySelectorAll('[data-del-shift]').forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm('Delete this shift?')) return;
        shifts = shifts.filter(s=>s.id!==b.dataset.delShift);
        await saveShifts();
        showToast('Shift deleted');
        render();
      };
    });
    document.querySelectorAll('[data-edit-fillup]').forEach(b=>{
      b.onclick = ()=>{ editingFillupId=b.dataset.editFillup; logMode='gas'; currentView='log'; render(); };
    });
    document.querySelectorAll('[data-del-fillup]').forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm('Delete this fill-up?')) return;
        fillups = fillups.filter(f=>f.id!==b.dataset.delFillup);
        await saveFillups();
        showToast('Fill-up deleted');
        render();
      };
    });
  }

  if(currentView==='reports'){
    document.querySelectorAll('.segmented button').forEach(b=>{
      b.onclick = ()=>{ reportsRange=b.dataset.range; render(); };
    });
    const exportJsonBtn = document.getElementById('export-json');
    if(exportJsonBtn) exportJsonBtn.onclick = ()=>{
      const backup = { exportedAt: new Date().toISOString(), shifts, fillups, customPlatforms };
      downloadFile(JSON.stringify(backup, null, 2), `gig-work-tracker-backup-${todayISO()}.json`, 'application/json');
      showToast('Backup downloaded');
    };
    const exportCsvBtn = document.getElementById('export-csv');
    if(exportCsvBtn) exportCsvBtn.onclick = ()=>{
      const periods = getPeriods();
      const platCols = allPlatforms();
      const header = ['Date','Start Time','End Time','Start Odo','End Odo','Hours','Miles',
        ...platCols.map(p=>p.label), 'Total Earnings','Gas Cost','Expenses','Net Pay','$/hr'];
      const rows = [...shifts].sort((a,b)=>a.date.localeCompare(b.date)).map(s=>{
        const d = deriveShift(s, periods);
        return [
          s.date, s.startTime||'', s.endTime||'', s.startOdo||'', s.endOdo||'',
          d.hours.toFixed(2), d.miles.toFixed(0),
          ...platCols.map(p=>(Number(s[p.key])||0).toFixed(2)),
          d.totalEarnings.toFixed(2), d.gasCost.toFixed(2), d.expenses.toFixed(2),
          d.net.toFixed(2), d.perHourGross.toFixed(2)
        ];
      });
      const csv = [header, ...rows].map(r=>r.map(csvEscape).join(',')).join('\n');
      downloadFile(csv, `gig-work-tracker-shifts-${todayISO()}.csv`, 'text/csv');
      showToast('CSV downloaded');
    };
  }
}

/* ======================= INIT ======================= */
(async function init(){
  document.getElementById('view-container').innerHTML = '<div class="empty">Loading your data…</div>';
  await loadData();
  render();
})();
</script>
</body>
</html>
