<style>
  :root{
    --bg:#12151a;
    --surface:#1b2028;
    --surface-2:#232a34;
    --border:#2c3542;
    --text:#eceef1;
    --text-dim:#aeb4bf;      /* brighter secondary text */
    --text-faint:#7c8492;    /* brighter tertiary text (was #576172) */
    --amber:#f4b740;
    --amber-dim:#8a6a25;
    --green:#4ade80;
    --green-dim:#265d3f;
    --rose:#fb7185;
    --rose-dim:#6b2f38;
    --blue:#60a5fa;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .num{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}
  .disp{font-family:'Oswald',sans-serif;}

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse 600px 300px at 50% -10%, rgba(244,183,64,0.08), transparent),
      var(--bg);
    position:relative;
  }

  .header{
    padding:calc(env(safe-area-inset-top, 0px) + 20px) 20px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  .header .brand{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:18px;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .header .brand span{color:var(--amber);}
  .header .date-chip{
    font-size:11px;
    color:var(--text-faint);
    font-family:'JetBrains Mono',monospace;
    letter-spacing:0.5px;
  }

  #view-container{
    flex:1;
    padding:16px 16px 90px;
    overflow-y:auto;
  }

  /* ---- cards ---- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
  }
  .card-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--text-faint);
    margin:0 0 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .stat-box{
    background:var(--surface-2);
    border-radius:10px;
    padding:12px;
  }
  .stat-box .label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.6px;font-weight:600;}
  .stat-box .value{font-family:'Oswald',sans-serif;font-size:25px;font-weight:600;margin-top:4px;color:var(--text);}
  .stat-box .value.green{color:var(--green);}
  .stat-box .value.rose{color:var(--rose);}
  .stat-box .value.amber{color:var(--amber);}
  .stat-box .value.blue{color:var(--blue);}
  .stat-box-full{
    background:var(--surface-2);
    border-radius:10px;
    padding:16px;
    text-align:center;
  }
  .stat-box-full .label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.6px;font-weight:600;}
  .stat-box-full .value{font-family:'Oswald',sans-serif;font-size:28px;font-weight:600;margin-top:6px;color:var(--text);}
  .stat-box-full .value.green{color:var(--green);}
  .stat-box-full .value.blue{color:var(--blue);}
  .stat-box-full .value.amber{color:var(--amber);}
  .stat-box-full .value.rose{color:var(--rose);}

  /* ---- big rate display (gauge replacement) ---- */
  .rate-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0 4px;}
  .rate-value{

<script>
/* ======================= STATE ======================= */
let shifts = [];   // {id,date,startTime,endTime,startOdo,endOdo,expenses, [platformKey]: amount...}
let fillups = [];  // {id,date,odometer,gallons,pricePerGallon}
let customPlatforms = []; // {key, label}
let currentView = 'home';
let logMode = 'shift'; // 'shift' | 'gas'
let historyMode = 'shifts'; // 'shifts' | 'fillups'
let reportsRange = 'week'; // day|week|month|year
let reportsDate = null; // anchor date for browsing; defaults to today, set on init
let editingShiftId = null;
let editingFillupId = null;
let addingPlatform = false;
let formDraft = null; // holds in-progress shift-form field values across re-renders (e.g. when adding/renaming a platform)
let fillupIsFull = true; // toggle state for the new-fill-up form: full tank vs partial/top-off

// Base platforms. Keys are permanent (used as storage field names) — do not rename existing keys.
const BASE_PLATFORMS = [
  {key:'uber', label:'Uber/Uber Eats', color:'#1fb6ff'},
  {key:'lyft', label:'Lyft', color:'#fb50a8'},
  {key:'doordash', label:'DoorDash', color:'#ff3d3d'},
  {key:'grubhub', label:'Cash Tips', color:'#7ac142'}
];
// Legacy keys from earlier versions of the app, kept only so old test data still totals correctly.
const LEGACY_PLATFORM_KEYS = ['instacart','other'];

function allPlatforms(){ return [...BASE_PLATFORMS, ...customPlatforms]; }
function isCustomPlatform(key){ return customPlatforms.some(p=>p.key===key); }
function platformHasAnyData(key){ return shifts.some(s => (Number(s[key])||0) !== 0); }

/* ======================= STORAGE =======================
   Uses the browser's own localStorage, so data lives on THIS device only,
   works fully offline, and survives being added to the Home Screen.
   Key names are permanent — never rename these, or existing data will
   appear to "disappear" (it'll still be in localStorage, just orphaned). */
const LS_SHIFTS = 'giggauge_shifts';
const LS_FILLUPS = 'giggauge_fillups';
const LS_CUSTOM_PLATFORMS = 'giggauge_customplatforms';

async function loadData(){
  try{
    const raw = localStorage.getItem(LS_SHIFTS);
    shifts = raw ? JSON.parse(raw) : [];
  }catch(e){ shifts = []; }
  try{
    const raw = localStorage.getItem(LS_FILLUPS);
    fillups = raw ? JSON.parse(raw) : [];
  }catch(e){ fillups = []; }
  try{
    const raw = localStorage.getItem(LS_CUSTOM_PLATFORMS);
    customPlatforms = raw ? JSON.parse(raw) : [];
  }catch(e){ customPlatforms = []; }
}
async function saveShifts(){
  try{ localStorage.setItem(LS_SHIFTS, JSON.stringify(shifts)); }
  catch(e){ showToast('Save failed — storage may be full'); }
}
async function saveFillups(){
  try{ localStorage.setItem(LS_FILLUPS, JSON.stringify(fillups)); }
  catch(e){ showToast('Save failed — storage may be full'); }
}
async function saveCustomPlatforms(){
  try{ localStorage.setItem(LS_CUSTOM_PLATFORMS, JSON.stringify(customPlatforms)); }
  catch(e){ showToast('Save failed — storage may be full'); }
}

function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function csvEscape(v){
  const s = String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ======================= HELPERS ======================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function todayISO(){
  // Use LOCAL date parts, not toISOString() (which is UTC and would roll
  // "today" over 7-8 hours early for US time zones).
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function fmtMoney(n){
  if(n===null||n===undefined||isNaN(n)) return '$0.00';
  const neg = n<0;
  const v = Math.abs(n).toFixed(2);
  return (neg?'-$':'$')+v;
}
function fmtNum(n, d=1){
  if(n===null||n===undefined||isNaN(n)) return '0';
  return Number(n).toFixed(d);
}
function fmtDateShort(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function fmtDateFull(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric', year:'numeric'});
}
function timeToMinutes(t){
  if(!t) return null;
  const [h,m] = t.split(':').map(Number);
  return h*60+m;
}
function computeHours(startTime, endTime){
  let s = timeToMinutes(startTime), e = timeToMinutes(endTime);
  if(s===null||e===null) return 0;
  let diff = e - s;
  if(diff < 0) diff += 24*60; // overnight shift
  return diff/60;
}
function isOpenShift(shift){
  return !shift.endTime || shift.endOdo===''||shift.endOdo===null||shift.endOdo===undefined;
}

/* --- gas periods derived from fillups, sorted by odometer ---
   A "full" fill-up closes a period and lets us compute real MPG.
   A "partial" fill-up (a splash/top-off, not filled to the top) can't be
   used to compute MPG on its own — its gallons and cost just get folded
   into whichever FULL fill-up comes next, so the math stays accurate. */
function getPeriods(){
  const sorted = [...fillups].sort((a,b)=> a.odometer - b.odometer);
  const periods = [];
  let baseline = null; // {odometer, date} of the last FULL fill-up
  let pendingGallons = 0, pendingCost = 0;

  sorted.forEach(f=>{
    const isFull = f.isFull !== false; // legacy records had no isFull field — treat as full
    const gallons = Number(f.gallons)||0;
    const cost = gallons * (Number(f.pricePerGallon)||0);

    if(baseline === null){
      if(isFull){
        baseline = {odometer:f.odometer, date:f.date};
      }
      // a partial before any full fill-up has no baseline to measure from — skip it
      return;
    }
    if(!isFull){
      pendingGallons += gallons;
      pendingCost += cost;
      return; // partials don't close a period on their own
    }
    // this is a FULL fill-up — close out the period since the last baseline
    const totalGallons = pendingGallons + gallons;
    const totalCost = pendingCost + cost;
    const milesBetween = f.odometer - baseline.odometer;
    const mpg = totalGallons>0 ? milesBetween/totalGallons : null;
    const blendedPrice = totalGallons>0 ? totalCost/totalGallons : (Number(f.pricePerGallon)||0);
    periods.push({
      startOdo: baseline.odometer,
      endOdo: f.odometer,
      startDate: baseline.date,
      endDate: f.date,
      mpg: mpg,
      pricePerGallon: blendedPrice
    });
    baseline = {odometer:f.odometer, date:f.date};
    pendingGallons = 0; pendingCost = 0;
  });
  return periods; // chronological by odometer
}

// Finds the MPG/price to apply to a shift: the fill-up period it falls inside;
// otherwise the nearest period before it; otherwise (shift predates all fill-up
// data) the EARLIEST period available — this is what lets a later fill-up
// retroactively price gas for earlier un-priced shifts, and lets the most
// recent known MPG keep pricing shifts going forward until a new fill-up is logged.
function effectiveMpgForShift(shift, periods){
  if(periods.length===0) return null;
  let match = periods.find(p => shift.date >= p.startDate && shift.date <= p.endDate);
  if(!match){
    const before = periods.filter(p=>p.endDate <= shift.date).sort((a,b)=> b.endDate.localeCompare(a.endDate));
    if(before.length) match = before[0];
  }
  if(!match){
    match = periods[0];
  }
  return match && match.mpg ? {mpg:match.mpg, price:match.pricePerGallon} : null;
}

function deriveShift(shift, periods){
  const open = isOpenShift(shift);
  const hours = open ? 0 : computeHours(shift.startTime, shift.endTime);
  const miles = open ? 0 : Math.max(0, (Number(shift.endOdo)||0) - (Number(shift.startOdo)||0));
  const earningsByPlatform = {};
  let totalEarnings = 0;
  allPlatforms().forEach(p=>{
    const v = Number(shift[p.key])||0;
    earningsByPlatform[p.key] = v;
    totalEarnings += v;
  });
  LEGACY_PLATFORM_KEYS.forEach(k=>{
    totalEarnings += Number(shift[k])||0;
  });
  const expenses = Number(shift.expenses)||0;
  const mpgInfo = open ? null : effectiveMpgForShift(shift, periods);
  let gasCost = 0, hasGasData = false;
  if(mpgInfo && mpgInfo.mpg > 0){
    hasGasData = true;
    gasCost = (miles / mpgInfo.mpg) * mpgInfo.price;
  }
  const net = totalEarnings - gasCost - expenses;
  const perHourGross = hours>0 ? totalEarnings/hours : 0;
  const perHourNet = hours>0 ? net/hours : 0;
  return {open, hours, miles, totalEarnings, gasCost, expenses, hasGasData, net, perHourGross, perHourNet, earningsByPlatform, mpg: mpgInfo?mpgInfo.mpg:null};
}

function allDerivedShifts(){
  const periods = getPeriods();
  return shifts.map(s => ({...s, d: deriveShift(s, periods)}));
}

function sumAgg(list){
  const agg = {hours:0, miles:0, totalEarnings:0, gasCost:0, expenses:0, net:0, anyGasData:false};
  list.forEach(s=>{
    agg.hours += s.d.hours;
    agg.miles += s.d.miles;
    agg.totalEarnings += s.d.totalEarnings;
    agg.gasCost += s.d.gasCost;
    agg.expenses += s.d.expenses;
    agg.net += s.d.net;
    if(s.d.hasGasData) agg.anyGasData = true;
  });
  agg.perHourGross = agg.hours>0 ? agg.totalEarnings/agg.hours : 0;
  agg.perHourNet = agg.hours>0 ? agg.net/agg.hours : 0;
  return agg;
}

function isSameDay(iso, ref){ return iso === ref; }
function isSameWeek(iso, ref){
  const d = new Date(iso+'T00:00:00'), r = new Date(ref+'T00:00:00');
  // Week runs Monday–Sunday.
  const startOfWeek = (dt)=>{
    const x=new Date(dt);
    const day=x.getDay(); // 0=Sun,1=Mon,...6=Sat
    const diffToMonday = (day===0) ? -6 : 1-day;
    x.setDate(x.getDate()+diffToMonday);
    return x;
  };
  return startOfWeek(d).getTime() === startOfWeek(r).getTime();
}
function isSameMonth(iso, ref){
  return iso.slice(0,7) === ref.slice(0,7);
}
function isSameYear(iso, ref){
  return iso.slice(0,4) === ref.slice(0,4);
}

function weekOfMonth(iso){
  // Numbers weeks using the same Monday–Sunday boundaries as everywhere else in the app,
  // so a week number here always matches the actual week shown in Week view.
  const d = new Date(iso+'T00:00:00');
  const y = d.getFullYear(), m = d.getMonth()+1;
  const monthStartMonday = mondayOfWeek(`${y}-${String(m).padStart(2,'0')}-01`);
  const thisMonday = mondayOfWeek(iso);
  const diffDays = Math.round((new Date(thisMonday+'T00:00:00') - new Date(monthStartMonday+'T00:00:00'))/86400000);
  return Math.floor(diffDays/7)+1;
}

function addDaysISO(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addMonthsISO(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setMonth(d.getMonth()+n);
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function mondayOfWeek(iso){
  const d = new Date(iso+'T00:00:00');
  const day = d.getDay();
  const diffToMonday = (day===0) ? -6 : 1-day;
  d.setDate(d.getDate()+diffToMonday);
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), da=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${da}`;
}
function daysInMonth(year, month1to12){
  return new Date(year, month1to12, 0).getDate();
}
function fmtDateTiny(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'numeric',day:'numeric'});
}
function fmtDayAbbrev(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short'}).slice(0,1);
}

function hourLabel(h){
  if(h===null||h===undefined) return '—';
  const ampm = h<12?'AM':'PM';
  let hh = h%12; if(hh===0) hh=12;
  return `${hh}:00 ${ampm}`;
}

function platformLabel(key){
  const p = allPlatforms().find(p=>p.key===key);
  return p ? p.label : key;
}

/* Small inline SVG bar chart. items: [{label, value, valueLabel, onClick}] */
function renderBarChart(items, opts){
  opts = opts || {};
  const height = opts.height || 130;
  const w = 320;
  const n = Math.max(1, items.length);
  const gap = 6;
  const barW = (w - gap*(n+1))/n;
  const maxAbs = Math.max(1, ...items.map(i=>Math.abs(i.value)));
  const zeroY = height - 22;
  const chartH = height - 36;
  let bars = '';
  items.forEach((it,i)=>{
    const x = gap + i*(barW+gap);
    const h = Math.max(2, (Math.abs(it.value)/maxAbs)*chartH);
    const y = it.value>=0 ? (zeroY-h) : zeroY;
    const color = it.value>=0 ? 'var(--green)' : 'var(--rose)';
    const clickAttr = it.onClick ? ` style="cursor:pointer" onclick="${it.onClick}"` : '';
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${color}"${clickAttr}><title>${it.label}: ${it.valueLabel}</title></rect>`;
    bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(zeroY+13)}" text-anchor="middle" font-size="8.5" fill="var(--text-faint)" font-family="Inter">${it.label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${height}" style="width:100%;height:${height}px;overflow:visible;">${bars}</svg>`;
}

/* Called from inline SVG bar onclick handlers to drill down into a period */
function chartDrill(range, date){
  reportsRange = range;
  reportsDate = date;
  render();
}

/* Best N-hour block to start, based on full shift history (completed shifts only) */
function computeBestBlock(derivedCompleted, blockLen){
  const buckets = {};
  for(let h=0;h<24;h++) buckets[h] = {hours:0, earnings:0, platformEarnings:{}};
  derivedCompleted.forEach(s=>{
    const sm = timeToMinutes(s.startTime);
    if(sm===null || s.d.hours<=0) return;
    const h = Math.floor(sm/60);
    buckets[h].hours += s.d.hours;
    buckets[h].earnings += s.d.totalEarnings;
    Object.keys(s.d.earningsByPlatform).forEach(k=>{
      buckets[h].platformEarnings[k] = (buckets[h].platformEarnings[k]||0) + s.d.earningsByPlatform[k];
    });
  });

  let best = null;
  for(let start=0; start<24; start++){
    let hours=0, earnings=0; const platformEarnings={};
    for(let i=0;i<blockLen;i++){
      const h = (start+i)%24;
      hours += buckets[h].hours;
      earnings += buckets[h].earnings;
      Object.keys(buckets[h].platformEarnings).forEach(k=>{
        platformEarnings[k] = (platformEarnings[k]||0) + buckets[h].platformEarnings[k];
      });
    }
    if(hours < 0.5) continue; // not enough data in this window
    const rate = earnings/hours;
    if(!best || rate > best.rate){
      const platformsUsed = Object.keys(platformEarnings)
        .filter(k=>platformEarnings[k]>0)
        .sort((a,b)=>platformEarnings[b]-platformEarnings[a])
        .map(k=>platformLabel(k));
      best = {start, rate, platformsUsed};
    }
  }
  return best;
}

function joinPlatformList(list){
  if(!list || list.length===0) return null;
  if(list.length===1) return list[0];
  if(list.length===2) return list[0]+' and '+list[1];
  return list.slice(0,-1).join(', ')+', and '+list[list.length-1];
}

function renderHistory(){
  const periods = getPeriods();
  const derived = [...shifts].sort((a,b)=> b.date.localeCompare(a.date) || (b.startTime||'').localeCompare(a.startTime||''))
    .map(s=>({...s, d: deriveShift(s, periods)}));

  const fillupsSorted = [...fillups].sort((a,b)=> b.date.localeCompare(a.date));

  let html = `
    <div class="toggle-row">
      <button data-historymode="shifts" class="${historyMode==='shifts'?'active':''}">Shifts (${derived.length})</button>
      <button data-historymode="fillups" class="${historyMode==='fillups'?'active':''}">Fill-Ups (${fillupsSorted.length})</button>

  `;

  if(historyMode==='shifts'){
    if(derived.length===0){
      html += `<div class="empty">No shifts logged yet.<br>Tap Log below to add your first one.</div>`;
    } else {
      let lastYear=null, lastMonth=null;
      derived.forEach(s=>{
        const year = s.date.slice(0,4);

        if(year !== lastYear){
          html += `<div class="year-header">${year}</div>`;

        }

          const md = new Date(monthKey+'-01T00:00:00');
          html += `<div class="month-header">${md.toLocaleDateString('en-US',{month:'long'})}</div>`;
          lastMonth = monthKey;
        }
        if(s.d.open){
          html += `
            <div class="entry-row">
              <div class="entry-top">
                <div class="entry-date">${fmtDateShort(s.date)}</div>
                <span class="inprogress-badge">In Progress</span>
              </div>
              <div class="entry-meta">
                <span>started <b>${s.startTime||'—'}</b></span>
                <span>start odo <b>${fmtNum(s.startOdo,0)}</b></span>
              </div>
              <div class="entry-actions">
                <button data-edit-shift="${s.id}">Finish Shift</button>
                <button data-del-shift="${s.id}">Delete</button>
              </div>
            </div>

        } else {
          html += `
            <div class="entry-row">
              <div class="entry-top">
                <div class="entry-date">${fmtDateShort(s.date)}</div>
                <div class="entry-net num" style="color:${s.d.net>=0?'var(--green)':'var(--rose)'}">${fmtMoney(s.d.net)}</div>
              </div>
              <div class="entry-meta">
                <span><b>${fmtNum(s.d.hours)}</b>h</span>
                <span><b>${fmtNum(s.d.miles,0)}</b> mi</span>
                <span>earn <b>${fmtMoney(s.d.totalEarnings)}</b></span>
                <span>gas <b>${fmtMoney(s.d.gasCost)}</b></span>
                <span><b>${fmtMoney(s.d.perHourGross)}</b>/hr</span>
              </div>
              <div class="entry-actions">
                <button data-edit-shift="${s.id}">Edit</button>
                <button data-del-shift="${s.id}">Delete</button>
              </div>

        const isFull = f.isFull !== false;
        const p = isFull ? periods.find(p=>p.endDate===f.date && p.endOdo===f.odometer) : null;
        html += `

/* ======================= REPORTS ======================= */
function renderReports(){
  const today = todayISO();
  if(!reportsDate) reportsDate = today;
  const anchor = reportsDate;
  const derived = allDerivedShifts();
  const completed = derived.filter(s=>!s.d.open);

  let filtered;
  if(reportsRange==='day') filtered = derived.filter(s=>isSameDay(s.date,anchor));
  else if(reportsRange==='week') filtered = derived.filter(s=>isSameWeek(s.date,anchor));
  else if(reportsRange==='month') filtered = derived.filter(s=>isSameMonth(s.date,anchor));
  else filtered = derived.filter(s=>isSameYear(s.date,anchor));

  const agg = sumAgg(filtered);

  // Best week of the anchor month
  const monthShifts = completed.filter(s=>isSameMonth(s.date, anchor));
  const weekBuckets = {};
  monthShifts.forEach(s=>{
    const w = weekOfMonth(s.date);
    weekBuckets[w] = (weekBuckets[w]||0) + s.d.net;
  });
  let bestWeek = null, bestWeekVal = -Infinity;
  Object.keys(weekBuckets).forEach(w=>{
    if(weekBuckets[w]>bestWeekVal){ bestWeekVal = weekBuckets[w]; bestWeek = Number(w); }
  });

  // Best month of the anchor year
  const yearShifts = completed.filter(s=>isSameYear(s.date, anchor));
  const monthBuckets = {};
  yearShifts.forEach(s=>{
    const m = s.date.slice(0,7);
    monthBuckets[m] = (monthBuckets[m]||0) + s.d.net;
  });
  let bestMonth = null, bestMonthVal = -Infinity;
  Object.keys(monthBuckets).forEach(m=>{
    if(monthBuckets[m]>bestMonthVal){ bestMonthVal = monthBuckets[m]; bestMonth = m; }
  });

  function monthLabel(m){
    if(!m) return '—';
    const d = new Date(m+'-01T00:00:00');
    return d.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  }

  const block2 = computeBestBlock(completed, 2);
  const block4 = computeBestBlock(completed, 4);

  // ---- period label + chart, based on selected range and anchor date ----
  let periodLabel = '';
  let chartHtml = '';
  if(reportsRange==='day'){
    periodLabel = fmtDateFull(anchor);
    const dayShift = completed.filter(s=>isSameDay(s.date,anchor));
    const platTotals = {};
    dayShift.forEach(s=>{ Object.keys(s.d.earningsByPlatform).forEach(k=>{ if(s.d.earningsByPlatform[k]>0) platTotals[k]=(platTotals[k]||0)+s.d.earningsByPlatform[k]; }); });
    const items = Object.keys(platTotals).map(k=>({label:platformLabel(k).slice(0,6), value:platTotals[k], valueLabel:fmtMoney(platTotals[k])}));
    chartHtml = items.length ? renderBarChart(items,{height:120}) : `<div style="font-size:12px;color:var(--text-faint);text-align:center;padding:20px 0;">No earnings logged this day.</div>`;
  } else if(reportsRange==='week'){
    const monday = mondayOfWeek(anchor);
    const sunday = addDaysISO(monday,6);
    const wNum = weekOfMonth(monday);
    periodLabel = `Week ${wNum} (${fmtDateTiny(monday)}–${fmtDateTiny(sunday)})`;
    const items = [];
    for(let i=0;i<7;i++){
      const d = addDaysISO(monday,i);
      const dayAgg = sumAgg(completed.filter(s=>s.date===d));
      items.push({label:fmtDayAbbrev(d), value:dayAgg.net, valueLabel:fmtMoney(dayAgg.net)+' · '+fmtDateTiny(d), onClick:`chartDrill('day','${d}')`});
    }
    chartHtml = renderBarChart(items);
  } else if(reportsRange==='month'){
    const y = Number(anchor.slice(0,4)), m = Number(anchor.slice(5,7));
    periodLabel = monthLabel(anchor.slice(0,7));
    const monthStart = `${y}-${String(m).padStart(2,'0')}-01`;
    const dim = daysInMonth(y,m);
    const monthEnd = `${y}-${String(m).padStart(2,'0')}-${String(dim).padStart(2,'0')}`;
    let weekStart = mondayOfWeek(monthStart);
    const items = [];
    let wIndex = 1;
    while(weekStart <= monthEnd){
      const weekEnd = addDaysISO(weekStart,6);
      const wAgg = sumAgg(completed.filter(s=> s.date>=weekStart && s.date<=weekEnd));
      items.push({label:'W'+wIndex, value:wAgg.net, valueLabel:fmtMoney(wAgg.net)+' · '+fmtDateTiny(weekStart)+'–'+fmtDateTiny(weekEnd), onClick:`chartDrill('week','${weekStart}')`});
      wIndex++;
      weekStart = addDaysISO(weekStart,7);
    }
    chartHtml = renderBarChart(items);
  } else {
    periodLabel = anchor.slice(0,4);
    const items = [];
    for(let m=1;m<=12;m++){
      const mm = String(m).padStart(2,'0');
      const monthIso = `${anchor.slice(0,4)}-${mm}-01`;
      const mAgg = sumAgg(completed.filter(s=>s.date.slice(0,7)===`${anchor.slice(0,4)}-${mm}`));
      items.push({label:monthIso.slice(5,7), value:mAgg.net, valueLabel:fmtMoney(mAgg.net)+' · '+monthLabel(monthIso.slice(0,7)), onClick:`chartDrill('month','${monthIso}')`});
    }
    chartHtml = renderBarChart(items);
  }

  return `
    <div class="card" style="padding:14px 16px;">
      <div class="card-title" style="margin-bottom:8px;">Browse By Date</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="date" id="reports-date-picker" value="${anchor}" style="flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px;">
        ${anchor!==today ? `<button class="btn btn-ghost btn-small" id="reports-jump-today">Today</button>` : ''}
      </div>
    </div>

    <div class="segmented">
      <button data-range="day" class="${reportsRange==='day'?'active':''}">Day</button>
      <button data-range="week" class="${reportsRange==='week'?'active':''}">Week</button>
      <button data-range="month" class="${reportsRange==='month'?'active':''}">Month</button>
      <button data-range="year" class="${reportsRange==='year'?'active':''}">Year</button>
    </div>

    ${renderHomePeriodBlock(periodLabel, agg, reportsRange)}

    <div class="card">
      <div class="card-title">${reportsRange==='day' ? 'Gross Earnings by Platform' : reportsRange==='year' ? 'Net Pay by Month' : 'Net Pay by '+(reportsRange==='week'?'Day':'Week')}</div>
      ${chartHtml}
      ${reportsRange!=='day' ? '<div style="font-size:10.5px;color:var(--text-faint);text-align:center;margin-top:6px;">Tap a bar to drill in</div>' : ''}
    </div>

    <div class="section-label">Today's Best Blocks</div>
    <div class="insight-card">
      <div class="itxt">Best 2-hour block to start today: <b>${block2 ? hourLabel(block2.start) : '—'}</b>${block2?` — avg ${fmtMoney(block2.rate)}/hr | ${joinPlatformList(block2.platformsUsed)||'—'}`:' (not enough history yet)'}.</div>
    </div>
    <div class="insight-card">
      <div class="itxt">Best 4-hour block to start today: <b>${block4 ? hourLabel(block4.start) : '—'}</b>${block4?` — avg ${fmtMoney(block4.rate)}/hr | ${joinPlatformList(block4.platformsUsed)||'—'}`:' (not enough history yet)'}.</div>
    </div>
    <div style="font-size:11px;color:var(--text-faint);margin:-4px 0 16px;">Based on your full shift history by start time, not just today's entries.</div>

    <div class="section-label">More Insights</div>
    <div class="insight-card">
      <div class="itxt">In ${monthLabel(anchor.slice(0,7))}, <b>Week ${bestWeek||'—'}</b> was the best week${bestWeek?` (net ${fmtMoney(bestWeekVal)})`:''}.</div>
    </div>
    <div class="insight-card">
      <div class="itxt">In ${anchor.slice(0,4)}, <b>${monthLabel(bestMonth)}</b> was the best month${bestMonth?` (net ${fmtMoney(bestMonthVal)})`:''}.</div>
    </div>
    ${completed.length===0?'<div class="empty">Log a few completed shifts to unlock insights.</div>':''}

    ${renderQuarterlyTaxCard(completed, today)}

    <div class="section-label">Backup &amp; Export</div>
    <div class="card">
      <div class="card-title">Keep Your Own Copy</div>
      <div style="font-size:12.5px;color:var(--text-dim);line-height:1.5;margin-bottom:12px;">
        Your data lives only in this browser on this device. Export a backup now and then — save it to Files, email it to yourself, or use the CSV for taxes.
      </div>
      <button class="btn btn-primary" id="export-json" style="margin-bottom:8px;">Export Full Backup (JSON)</button>
      <button class="btn btn-ghost" id="export-csv">Export Shifts as CSV</button>
    </div>

    <div class="card">
      <div class="card-title">Restore From a Backup</div>
      <div style="font-size:12.5px;color:var(--text-dim);line-height:1.5;margin-bottom:12px;">
        Pick a JSON backup file you exported earlier. This replaces whatever is currently in the app with what's in that file.
      </div>
      <label class="btn btn-ghost" for="restore-file-input" style="display:block;text-align:center;">Choose Backup File (.json)</label>
      <input type="file" id="restore-file-input" accept="application/json,.json" style="display:none;">
      <div id="restore-status" style="font-size:11px;color:var(--text-faint);margin-top:8px;"></div>
    </div>
  `;
}

/* ======================= QUARTERLY ESTIMATED TAX ======================= */
function getQuarterPeriods(year){
  return [
    {label:'Q1', start:`${year}-01-01`, end:`${year}-03-31`, due:`Apr 15, ${year}`},
    {label:'Q2', start:`${year}-04-01`, end:`${year}-05-31`, due:`Jun 15, ${year}`},
    {label:'Q3', start:`${year}-06-01`, end:`${year}-08-31`, due:`Sep 15, ${year}`},
    {label:'Q4', start:`${year}-09-01`, end:`${year}-12-31`, due:`Jan 15, ${year+1}`}
  ];
}

function renderQuarterlyTaxCard(completed, today){
  const year = Number(today.slice(0,4));
  const periods = getQuarterPeriods(year);
  const rows = periods.map(p=>{
    const inRange = completed.filter(s=> s.date>=p.start && s.date<=p.end);
    const net = sumAgg(inRange).net;
    const tax = Math.max(0, net) * 0.153;
    const current = today>=p.start && today<=p.end;
    return `
      <div class="stat-box" style="${current?'border:1px solid var(--amber-dim);':''}">
        <div class="label">${p.label} ${current?'· current':''}</div>
        <div class="value num" style="font-size:19px;">${fmtMoney(net)} net</div>
        <div style="font-size:12px;color:var(--amber);margin-top:2px;font-family:'JetBrains Mono',monospace;">${fmtMoney(tax)} est. tax</div>
        <div style="font-size:10.5px;color:var(--text-faint);margin-top:4px;">Due ${p.due}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="section-label">Estimated Quarterly Taxes (${year})</div>
    <div class="card">
      <div class="card-title">Rough Estimate Only: Net Income × 15.3%</div>
      <div class="stat-grid">${rows}</div>
    </div>
  `;
}

/* ======================= EVENT HANDLERS ======================= */
function attachViewHandlers(){
  // tab nav
  document.querySelectorAll('.tabbar button').forEach(b=>{
    b.onclick = ()=>{ currentView = b.dataset.view; editingShiftId=null; editingFillupId=null; addingPlatform=false; formDraft=null; fillupIsFull=true; render(); };
  });

  if(currentView==='home'){
    const qb = document.getElementById('home-quicklog');
    if(qb) qb.onclick = ()=>{ currentView='log'; logMode='shift'; render(); };
  }

  if(currentView==='log'){
    document.querySelectorAll('.toggle-row button').forEach(b=>{
      b.onclick = ()=>{ logMode=b.dataset.mode; editingShiftId=null; editingFillupId=null; addingPlatform=false; formDraft=null; fillupIsFull=true; render(); };
    });

    if(logMode==='shift'){
      const captureFormDraft = ()=>{
        formDraft = formDraft || {};
        document.querySelectorAll('#view-container input[id^="f-"]').forEach(el=>{
          formDraft[el.id] = el.value;
        });
      };
      const upd = ()=>{
        captureFormDraft();
        const start = document.getElementById('f-start').value;
        const end = document.getElementById('f-end').value;
        const so = Number(document.getElementById('f-startodo').value)||0;
        const eo = Number(document.getElementById('f-endodo').value)||0;
        document.getElementById('prev-hours').textContent = end ? fmtNum(computeHours(start,end)) : '—';
        document.getElementById('prev-miles').textContent = eo ? fmtNum(Math.max(0,eo-so),0) : '—';
        let total = 0;
        allPlatforms().forEach(p=>{ const el=document.getElementById('f-'+p.key); if(el) total += Number(el.value)||0; });
        document.getElementById('prev-total').textContent = fmtMoney(total);
      };
      ['f-date','f-start','f-end','f-startodo','f-endodo','f-expenses', ...allPlatforms().map(p=>'f-'+p.key)].forEach(id=>{
        const el = document.getElementById(id);
        if(el) el.oninput = upd;
      });
      upd();

      const showAddBtn = document.getElementById('show-add-platform');
      if(showAddBtn) showAddBtn.onclick = ()=>{ captureFormDraft(); addingPlatform=true; render(); };
      const confirmAddBtn = document.getElementById('confirm-add-platform');
      if(confirmAddBtn) confirmAddBtn.onclick = async ()=>{
        captureFormDraft();
        const nameInput = document.getElementById('new-platform-name');
        const name = nameInput.value.trim();
        if(!name){ showToast('Enter a platform name'); return; }
        const key = 'custom_' + name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') + '_' + uid();
        const colors = ['#60a5fa','#f4b740','#4ade80','#fb7185','#a78bfa','#fb923c'];
        const color = colors[customPlatforms.length % colors.length];
        customPlatforms.push({key, label:name, color});
        await saveCustomPlatforms();
        addingPlatform = false;
        showToast(name+' added');
        render();
      };

      document.querySelectorAll('[data-edit-plat]').forEach(b=>{
        b.onclick = async ()=>{
          captureFormDraft();
          const key = b.dataset.editPlat;
          const cp = customPlatforms.find(p=>p.key===key);
          if(!cp) return;
          const newName = prompt('Rename platform:', cp.label);
          if(newName===null) return;
          const trimmed = newName.trim();
          if(!trimmed){ showToast('Name cannot be empty'); return; }
          cp.label = trimmed;
          await saveCustomPlatforms();
          showToast('Platform renamed');
          render();
        };
      });
      document.querySelectorAll('[data-del-plat]').forEach(b=>{
        b.onclick = async ()=>{
          const key = b.dataset.delPlat;
          if(platformHasAnyData(key)){ showToast("Can't delete — this platform already has earnings recorded"); return; }
          if(!confirm('Delete this platform?')) return;
          captureFormDraft();
          customPlatforms = customPlatforms.filter(p=>p.key!==key);
          await saveCustomPlatforms();
          if(formDraft) delete formDraft['f-'+key];
          showToast('Platform deleted');
          render();
        };
      });

      document.getElementById('save-shift').onclick = async ()=>{
        const date = document.getElementById('f-date').value;
        const startTime = document.getElementById('f-start').value;
        const endTime = document.getElementById('f-end').value;
        const startOdo = document.getElementById('f-startodo').value;
        const endOdo = document.getElementById('f-endodo').value;
        if(!date || !startTime || startOdo===''){ showToast('Date, start time, and start odometer are required'); return; }
        if(endOdo!=='' && Number(endOdo) < Number(startOdo)){ showToast('End odometer must be ≥ start odometer'); return; }
        const record = {
          id: editingShiftId || uid(),
          date, startTime,
          endTime: endTime || null,
          startOdo,
          endOdo: endOdo!=='' ? endOdo : null,
          expenses: document.getElementById('f-expenses').value || 0
        };
        allPlatforms().forEach(p=>{ const el=document.getElementById('f-'+p.key); record[p.key] = el ? (el.value||0) : 0; });

        if(editingShiftId){
          const idx = shifts.findIndex(s=>s.id===editingShiftId);
          shifts[idx] = record;
          editingShiftId = null;
        } else {
          shifts.push(record);
        }
        await saveShifts();
        formDraft = null;
        showToast(record.endTime && record.endOdo ? 'Shift saved' : 'Shift started — finish it later from History');
        currentView='history';
        render();
      };

      const cancelBtn = document.getElementById('cancel-edit-shift');
      if(cancelBtn) cancelBtn.onclick = ()=>{ editingShiftId=null; addingPlatform=false; formDraft=null; currentView='home'; render(); };
    }

    if(logMode==='gas'){
      document.querySelectorAll('[data-filltype]').forEach(b=>{
        b.onclick = ()=>{ fillupIsFull = (b.dataset.filltype==='full'); render(); };
      });

      const upd = ()=>{
        const gallons = Number(document.getElementById('g-gallons').value)||0;
        const price = Number(document.getElementById('g-price').value)||0;
        document.getElementById('prev-gastotal').textContent = fmtMoney(gallons*price);
        const mpgEl = document.getElementById('prev-mpg');
        if(mpgEl){
          const odo = Number(document.getElementById('g-odo').value)||0;
          // Preview only: compares against the last FULL fill-up before this odometer.
          const priorFulls = fillups.filter(f=>f.id!==editingFillupId && f.isFull!==false && f.odometer<odo).sort((a,b)=>b.odometer-a.odometer);
          const prev = priorFulls[0];
          if(prev && gallons>0){
            mpgEl.textContent = fmtNum((odo-prev.odometer)/gallons,1) + ' (est.)';
          } else {
            mpgEl.textContent = '—';
          }
        }
      };
      ['g-odo','g-gallons','g-price'].forEach(id=>{
        const el = document.getElementById(id);
        if(el) el.oninput = upd;
      });
      upd();

      document.getElementById('save-fillup').onclick = async ()=>{
        const date = document.getElementById('g-date').value;
        const odometer = Number(document.getElementById('g-odo').value);
        const gallons = Number(document.getElementById('g-gallons').value);
        const pricePerGallon = Number(document.getElementById('g-price').value);
        if(!date || !odometer || !gallons || !pricePerGallon){ showToast('All fields are required'); return; }
        const isFull = editingFillupId ? fillupIsFull : fillupIsFull; // current toggle selection
        const record = { id: editingFillupId || uid(), date, odometer, gallons, pricePerGallon, isFull };
        if(editingFillupId){
          const idx = fillups.findIndex(f=>f.id===editingFillupId);
          fillups[idx] = record;
          editingFillupId = null;
        } else {
          fillups.push(record);
        }
        await saveFillups();
        fillupIsFull = true;
        showToast(isFull ? 'Fill-up saved' : 'Partial fill saved — it\'ll fold into your next full tank');
        currentView='history';
        render();
      };

      const cancelBtn = document.getElementById('cancel-edit-fillup');
      if(cancelBtn) cancelBtn.onclick = ()=>{ editingFillupId=null; fillupIsFull=true; currentView='home'; render(); };
    }
  }

  if(currentView==='history'){
    document.querySelectorAll('[data-historymode]').forEach(b=>{
      b.onclick = ()=>{ historyMode=b.dataset.historymode; render(); };
    });
    document.querySelectorAll('[data-edit-shift]').forEach(b=>{
      b.onclick = ()=>{ editingShiftId=b.dataset.editShift; logMode='shift'; addingPlatform=false; formDraft=null; currentView='log'; render(); };
    });
    document.querySelectorAll('[data-del-shift]').forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm('Delete this shift?')) return;
        shifts = shifts.filter(s=>s.id!==b.dataset.delShift);
        await saveShifts();
        showToast('Shift deleted');
        render();
      };
    });
    document.querySelectorAll('[data-edit-fillup]').forEach(b=>{
      b.onclick = ()=>{
        editingFillupId=b.dataset.editFillup;
        const f = fillups.find(x=>x.id===editingFillupId);
        fillupIsFull = f ? (f.isFull !== false) : true;
        logMode='gas'; currentView='log'; render();
      };
    });
    document.querySelectorAll('[data-del-fillup]').forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm('Delete this fill-up?')) return;
        fillups = fillups.filter(f=>f.id!==b.dataset.delFillup);
        await saveFillups();
        showToast('Fill-up deleted');
        render();
      };
    });
  }

  if(currentView==='reports'){
    document.querySelectorAll('.segmented button').forEach(b=>{
      b.onclick = ()=>{ reportsRange=b.dataset.range; render(); };
    });
    const datePicker = document.getElementById('reports-date-picker');
    if(datePicker) datePicker.onchange = ()=>{ reportsDate = datePicker.value || todayISO(); render(); };
    const jumpTodayBtn = document.getElementById('reports-jump-today');
    if(jumpTodayBtn) jumpTodayBtn.onclick = ()=>{ reportsDate = todayISO(); render(); };
    const exportJsonBtn = document.getElementById('export-json');
    if(exportJsonBtn) exportJsonBtn.onclick = ()=>{
      const backup = { exportedAt: new Date().toISOString(), shifts, fillups, customPlatforms };
      downloadFile(JSON.stringify(backup, null, 2), `gig-work-tracker-backup-${todayISO()}.json`, 'application/json');
      showToast('Backup downloaded');
    };
    const exportCsvBtn = document.getElementById('export-csv');
    if(exportCsvBtn) exportCsvBtn.onclick = ()=>{
      const periods = getPeriods();
      const platCols = allPlatforms();
      const header = ['Date','Start Time','End Time','Start Odo','End Odo','Hours','Miles',
        ...platCols.map(p=>p.label), 'Total Gross Earnings','Gas Cost','Expenses','Net Pay','$/hr'];
      const rows = [...shifts].sort((a,b)=>a.date.localeCompare(b.date)).map(s=>{
        const d = deriveShift(s, periods);
        return [
          s.date, s.startTime||'', s.endTime||'', s.startOdo||'', s.endOdo||'',
          d.hours.toFixed(2), d.miles.toFixed(0),
          ...platCols.map(p=>(Number(s[p.key])||0).toFixed(2)),
          d.totalEarnings.toFixed(2), d.gasCost.toFixed(2), d.expenses.toFixed(2),
          d.net.toFixed(2), d.perHourGross.toFixed(2)
        ];
      });
      const csv = [header, ...rows].map(r=>r.map(csvEscape).join(',')).join('\n');
      downloadFile(csv, `gig-work-tracker-shifts-${todayISO()}.csv`, 'text/csv');
      showToast('CSV downloaded');
    };

    const restoreInput = document.getElementById('restore-file-input');
    if(restoreInput) restoreInput.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const statusEl = document.getElementById('restore-status');
      const reader = new FileReader();
      reader.onload = async (ev)=>{
        try{
          const data = JSON.parse(ev.target.result);
          if(!Array.isArray(data.shifts) || !Array.isArray(data.fillups)){
            throw new Error('This file is missing shifts or fillups data.');
          }
          const count = data.shifts.length;
          if(!confirm(`This backup has ${count} shift(s)${data.exportedAt ? ' from '+new Date(data.exportedAt).toLocaleString() : ''}. Restoring will replace everything currently in the app. Continue?`)) {
            restoreInput.value = '';
            return;
          }
          shifts = data.shifts;
          fillups = data.fillups;
          customPlatforms = Array.isArray(data.customPlatforms) ? data.customPlatforms : [];
          await saveShifts();
          await saveFillups();
          await saveCustomPlatforms();
          showToast('Backup restored');
          currentView = 'home';
          render();
        }catch(err){
          statusEl.textContent = 'Could not read that file — make sure it\'s the .json backup, not the .csv.';
          statusEl.style.color = 'var(--rose)';
        }
      };
      reader.readAsText(file);
    };
  }
}

/* ======================= INIT ======================= */
(async function init(){
  document.getElementById('view-container').innerHTML = '<div class="empty">Loading your data…</div>';
  await loadData();
  render();
})();
</script>
